[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sophgo-fire-smoke-monitor"
version = "0.1.0"
description = "BM1684X RTSP frame uploader with optional YOLO26 trigger"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.24,<2.0",
  "PyYAML>=6,<7",
  "httpx==0.27.2",
]

[project.scripts]
fire-smoke-monitor = "fire_smoke_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fire_smoke_monitor.vendor.yolo26" = ["LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
