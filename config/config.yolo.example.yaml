# YOLO 模式模板。复制为 config/config.yolo.yaml 或 config/config.yaml 后修改。
# 保留现场实际接口、摄像头和密钥设置；路径相对本 YAML，修改后检查并重启。
# 每路最新一帧 -> 公平轮询 YOLO -> 命中图异步上传；不保存本地图片。
mode: yolo_trigger

pipeline:
  # 远端完整 HTTP(S) 地址，必须以 /v1/frames 结尾，不是 GitHub 地址。
  endpoint: http://192.168.1.200:18080/v1/frames
  # 本机唯一标识，多台盒子不能重复；1-64 位字母、数字、下划线、横线。
  machine_id: se7-01
  # 无鉴权留空；有鉴权填变量名 PIPELINE_API_KEY，值放环境或同目录 pipeline.env。
  api_key_env: ""
  # HTTP 并发数，不是 YOLO 数量。建议 1-2；YOLO 允许 1-8，需远端能够承载。
  workers: 2
  # 单次请求总超时（秒），含连接、上传及读响应；失败不重试这张图。
  timeout_sec: 10
  # 命中图采样到开始上传的最大年龄（秒），含推理、编码和等待；过期丢弃。
  # 每路只有一张最新待传命中图；新命中替换旧命中，非命中图不覆盖它。
  # 增大允许更旧的图，但不增加远端吞吐，也不保证每次命中都上传成功。
  max_pending_age_sec: 60
  # JPEG 最大字节数（此处 8 MiB），须与远端 MAX_IMAGE_BYTES 一致；超限跳过。
  max_image_bytes: 8388608
  # 最大像素数（宽×高，此处 1600 万），须与远端一致；不自动缩放原图。
  max_image_pixels: 16000000
  # 仅 YOLO 使用本节。平时有空位即发；降频只限制 HTTP，绝不暂停各路推理。
  backoff:
    # 按响应完成顺序，每连续 N 次 429/503 开始/升级降频，两种状态合并计数。
    after_failures: 2
    # 首次降频时全机两次上传之间的最小间隔（秒），继续过载就翻倍。
    initial_interval_sec: 2.5
    # 降频间隔上限（秒），必须 >= initial_interval_sec。
    max_interval_sec: 60
    # 连续 N 次 202 且 accepted=true 后间隔减半，逐步恢复到有空位即发。
    recover_after_successes: 3

runtime:
  # BM1684X 设备编号，SoC 单芯片通常为 0。
  dev_id: 0
  # 每路应用层最新解码帧槽，固定为 1；旧值会覆盖并告警。
  # RTSP 持续传输/解码；底层参考帧、正在推理的图和命中 JPEG 不计入此槽。
  decoder_queue_size: 1
  # 秒。读取时持续无帧达到此时间后申请后台重建；检查在该路轮询时发生。
  # read 非阻塞；不是网络连接超时，也不是后台每 2 秒主动巡检一次。
  read_timeout_sec: 2
  # 单路重建重试间隔及无帧告警冷却（秒）；离线路不阻止其他路推理。
  reconnect_cooldown_sec: 10
  # INFO 记录受理结果、覆盖统计和异常；DEBUG 额外记录每帧提交详情。
  log_level: INFO
  # 日志目录，相对本 YAML；两种模式均不保存检测图片。
  log_dir: ../logs
  # 含当天的日志保留自然日数，允许 1-30。
  log_retention_days: 30
  # 单个受管日志文件上限（MiB），达到后分段轮转。
  log_max_file_mb: 100
  # 所有 monitor-*.log 合计上限（MiB），须 >= 单文件上限；优先删除旧分段。
  log_max_total_mb: 1024
  # 日志所在磁盘至少保留的空间（GiB），不足时清旧日志并抑制低级别日志。
  min_free_disk_gb: 5
  # 日志容量/磁盘余量检查周期（秒），允许 10-3600。
  disk_check_interval_sec: 60

health:
  # 连续本地检测/编码/提交异常达到次数后退出，由 systemd 重启；成功一次清零。
  # 摄像头无帧、HTTP 失败、丢弃旧图不计入致命异常阈值。
  max_consecutive_processing_failures: 10
  # 主循环/上传循环最长无心跳时间（秒）；须大于最慢单帧处理耗时。
  # 不是整轮耗时，每处理一路会更新心跳。单帧卡死仍由 watchdog 处理。
  scheduler_stall_sec: 30
  # 组件状态及每路覆盖统计的定期日志间隔（秒）；状态变化另有即时日志。
  status_log_interval_sec: 300
  # 某路多久未完成一次 YOLO 推理，标记 inference_<id> 降级（秒，不强制重启）。
  # 未命中也算成功推理；应大于该路目标周期及现场实际最慢轮询周期。
  inference_stale_sec: 60
  # 有命中但持续多久无相应成功上传，标记 delivery_<id> 降级（秒，不重启）。
  # 持续新命中不反复重置等待；没有命中的路不会因此告警。
  upload_stale_sec: 300

models:
  yolo26:
    # BM1684X batch=1 BModel；火烟须用对应训练模型，COCO 模型没有 fire/smoke 类。
    bmodel: ../models/yolo26/fire_smoke_yolo26s_int8_1b.bmodel
    # 每行一个类别，顺序必须与模型 class_id 一致。
    class_names: ./fire_smoke.names
    # 只上传命中这些类别的整张原图，多框只上传一次；名称须存在于类别文件。
    target_classes: [fire, smoke]
    # 置信度阈值，0-1；调低可能增加召回，也增加误报/上传压力，需场景验证。
    conf_threshold: 0.25
    # 每路目标周期（秒，开始到开始），不是全机两次推理之间的等待时间。
    # 实际推理/编码耗时已计入；启动自动错峰，过载公平轮询，不补跑旧帧。
    # N 路总处理耗时超过此周期时，各路实际周期延长；看 infer_gap / process_ms。
    interval_sec: 3

# 软件最多 64 路，不代表硬件吞吐保证；按需添加唯一 id，先评估子码流负载。
cameras:
  # 接口的 stream_id；1-64 位字母、数字、下划线、横线，不可重复。
  - id: camera_01
    # 可选显示名称（最长 256 字符），作为 stream_name 上传。
    name: 仓库东门
    # 实际 RTSP 地址；含密码的配置文件建议 chmod 600。
    url: rtsp://user:password@192.168.1.101:554/stream1
    # 可选：本路目标检测周期（秒）；不写继承 models.yolo26.interval_sec。
    # interval_sec: 5
  - id: camera_02
    name: 仓库西门
    url: rtsp://user:password@192.168.1.102:554/stream1
