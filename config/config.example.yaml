# yolo_trigger：命中目标后上传；periodic：不加载 YOLO，按周期直接上传。
# 切换后重启程序；两种模式都不在盒子保存图片。
mode: yolo_trigger

pipeline:
  # 填实际部署地址，不是 GitHub 仓库链接，也不是 SAM3 /predict/file 地址。
  endpoint: http://192.168.1.200:18080/v1/frames
  # 多台盒子必须使用不同 machine_id。
  machine_id: se7-01
  # 服务端未配置密钥时留空；否则填 PIPELINE_API_KEY，并在环境中设置同名变量。
  api_key_env: ""
  workers: 2
  timeout_sec: 10
  # 每路最多一个正在上传帧 + 一个最新待传帧；过期帧丢弃，不补发。
  max_pending_age_sec: 30
  # 应与远端 MAX_IMAGE_BYTES / MAX_IMAGE_PIXELS 一致。
  max_image_bytes: 8388608
  max_image_pixels: 16000000

runtime:
  dev_id: 0
  decoder_queue_size: 2
  # 调度器始终非阻塞；单路持续无有效帧达到该时间后，在后台重建该路解码器。
  read_timeout_sec: 2
  # 单路解码器重建尝试间隔，同时也是无帧告警冷却时间。
  reconnect_cooldown_sec: 10
  log_level: INFO
  log_dir: ../logs
  # 含当天，最多保留最近 30 个自然日；可设为 1-30。
  log_retention_days: 30

cameras:
  - id: camera_01
    name: 仓库东门
    url: rtsp://user:password@192.168.1.101:554/stream1
    # 可选：覆盖当前模式的默认采样间隔（秒）。
    # interval_sec: 15
  # 最多 16 路；按需继续添加唯一 id 和对应 RTSP 地址。
  # - id: camera_02
  #   url: rtsp://user:password@192.168.1.102:554/stream1

periodic:
  interval_sec: 10

# periodic 模式忽略此节，也可以完全删除；不需要 BModel 和类别文件。
models:
  yolo26:
    bmodel: ../models/yolo26/fire_smoke_yolo26s_int8_1b.bmodel
    class_names: ./fire_smoke.names
    target_classes: [fire, smoke]
    conf_threshold: 0.25
    interval_sec: 3
